<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biermeile Live</title>
    
    <style>
        /* Basic styling for a clean, dark theme */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f; /* YouTube's dark mode background */
            color: #f1f1f1;
            font-family: 'Roboto', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-top: 40px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #ff0000; /* YouTube red accent */
        }

        p {
            font-size: 1.1rem;
            color: #aaaaaa;
        }

        /* This container makes the video responsive */
        .video-container {
            width: 90%;
            max-width: 1200px;
            aspect-ratio: 16 / 9; /* Keeps the standard widescreen ratio */
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Forces the iframe to fill the container perfectly */
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <main class="video-container">
		<iframe 
            src="https://www.youtube-nocookie.com/embed/6oBSLsDccnw?autoplay=1&mute=1" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
	</main>
</body>
</html>
